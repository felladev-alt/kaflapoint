<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu - KAFLA POINT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(135deg, #000000, #011b58, #000000);
  color: white;
}

nav {
  display: flex;
  justify-content: space-between;
  padding: 20px 60px;
}

.logo {
  font-size: 22px;
  font-weight: 700;
}

.logo span {
  color: #ff3c3c;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
  opacity: 0.8;
}

nav a:hover {
  opacity: 1;
}

/* TITLE */
.title {
  text-align: center;
  margin: 40px 0;
}

.title h1 {
  font-size: 50px;
}

.title span {
  color: #ff3c3c;
}

/* MENU GRID */
.menu {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  padding: 30px;
  gap: 20px;
}

.card {
  background: linear-gradient(135deg, #4f5da0, #1c3a80, #000a49);
  padding: 20px;
  border-radius: 15px;
  text-align: center;
  transition: 0.3s;
  text-decoration: none;
  color: white;
  display: block;
}

.card:hover {
  transform: translateY(-10px);
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.card h3 {
  margin: 15px 0 5px;
}

.price {
  color: #ff3c3c;
  font-weight: 600;
}

.btn {
  margin-top: 10px;
  padding: 10px 20px;
  border: none;
  background: #ff3c3c;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

.btn:hover {
  background: #ff1c1c;
}

/* 📱 MOBILE RESPONSIVE */
@media (max-width: 768px) {

  nav {
    padding: 15px 20px;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  nav div {
    margin-top: 5px;
  }

  .title h1 {
    font-size: 32px;
  }

  .menu {
    grid-template-columns: repeat(2, 1fr);
    padding: 15px;
    gap: 15px;
  }

  .card {
    padding: 15px;
  }

}

.card {
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.card:hover img {
  transform: scale(1.08);
  transition: 0.3s;
}


</style>
</head>

<nav>
