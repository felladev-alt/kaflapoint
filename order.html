<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #0b0f17;
  color: white;
}

/* HEADER */
.header {
  padding: 15px 20px;
  font-size: 20px;
  font-weight: bold;
}

/* MENU LIST */
.menu-list {
  display: flex;
  flex-direction: column;
  gap: 15px;
  padding: 20px;
}

.item {
  background: #121826;
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  gap: 15px;
  padding: 10px;
}

.item img {
  width: 120px;
  height: 100px;
  object-fit: cover;
  border-radius: 10px;
}

.item-info {
  flex: 1;
}

.item h3 {
  margin: 0;
}

.price {
  color: #ff3c3c;
  font-weight: bold;
}

.add-btn {
  background: #ff3c3c;
  border: none;
  color: white;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
}

/* CART BAR */
.cart-bar {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #ff3c3c;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  display: none;
}

.cart-bar {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: linear-gradient(135deg, #600000, #a50a0a);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  display: none;
  font-weight: 600;
}

.cart-bar button {
  background: white;
  border: none;
  padding: 8px 15px;
  border-radius: 6px;
  cursor: pointer;
}

/* CART PAGE */
.cart-page {
  display: none;
  padding: 20px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  background: #121826;
  margin-bottom: 10px;
  border-radius: 8px;
}

.confirm-btn {
  margin-top: 20px;
  background: #25D366;
  padding: 12px;
  border: none;
  width: 100%;
  color: white;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
}

/* RESPONSIVE */
@media(max-width:600px){
  .item {
    flex-direction: column;
  }

  .item img {
    width: 100%;
    height: 180px;
  }
}

.cart-item button {
  background: #ff3c3c;
  border: none;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

.cart-item button:hover {
  background: #ff1c1c;
}

</style>
</head>

<body>

let cart = [];

let menuList = document.getElementById("menuList");

menu.forEach((item, index) => {
  menuList.innerHTML += `
    <div class="item">
      <img src="${item.img}">
      <div class="item-info">
        <h3>${item.name}</h3>
        <div class="price">₹${item.price}</div>
        <button class="add-btn" onclick="addToCart(${index})">Add +</button>
      </div>
    </div>
  `;
});

function addToCart(index) {
  cart.push(menu[index]);   // add item
  updateCartUI();           // update UI
}

function updateCartUI() {
  const cartBar = document.getElementById("cartBar");
  const cartCount = document.getElementById("cartCount");
  const cartTotal = document.getElementById("cartTotal");

  cartBar.style.display = "flex";

  let total = 0;

  for (let i = 0; i < cart.length; i++) {
    total += Number(cart[i].price);   // ✅ force number
  }

  cartCount.innerText = cart.length + " items";
  cartTotal.innerText = "₹" + total;
}

function openCart() {
  document.getElementById("cartPage").style.display = "block";
  document.getElementById("menuList").style.display = "none";
  document.getElementById("cartBar").style.display = "none";

  let cartItems = document.getElementById("cartItems");
  cartItems.innerHTML = "";

  let total = 0;

  cart.forEach(item => {
    total += item.price;
    cartItems.innerHTML += `
      <div class="cart-item">
        <span>${item.name}</span>
        <span>₹${item.price}</span>
      </div>
    `;
  });

  document.getElementById("totalPrice").innerText = "Total: ₹" + total;
}

function openCart() {
  document.getElementById("cartPage").style.display = "block";
  document.getElementById("menuList").style.display = "none";
  document.getElementById("cartBar").style.display = "none";

  let cartItems = document.getElementById("cartItems");
  cartItems.innerHTML = "";

  let total = 0;

  // ✅ GROUP ITEMS
  let grouped = {};

  cart.forEach(item => {
    if (grouped[item.name]) {
      grouped[item.name].qty += 1;
    } else {
      grouped[item.name] = {
        price: item.price,
        qty: 1
      };
    }
  });

  // ✅ DISPLAY GROUPED ITEMS
  for (let name in grouped) {
    let item = grouped[name];
    let itemTotal = item.price * item.qty;
    total += itemTotal;

cartItems.innerHTML += `
  <div class="cart-item">
    <div>
      ${name} x${item.qty}
    </div>

    <div style="display:flex; gap:10px; align-items:center;">
      <button onclick="removeOne('${name}')" style="padding:4px 8px;">−</button>
      <span>₹${itemTotal}</span>
      <button onclick="addOne('${name}')" style="padding:4px 8px;">+</button>
    </div>
  </div>
`;
  }

  document.getElementById("totalPrice").innerText = "Total: ₹" + total;
}

function sendWhatsApp() {
  let text = "Order Details:%0A";
  let total = 0;

  cart.forEach(item => {
    text += item.name + " - ₹" + item.price + "%0A";
    total += item.price;
  });

  text += "%0ATotal: ₹" + total;

  window.open("https://wa.me/91XXXXXXXXXX?text=" + text, "_blank");
}

function sendWhatsApp() {
  let number = "9855891578"; // 👉 replace with your number (no +, no spaces)

  let message = "🛒 *New Order - KAFLA POINT*%0A%0A";

  let total = 0;

  // GROUP ITEMS (same as cart view)
  let grouped = {};

  cart.forEach(item => {
    if (grouped[item.name]) {
      grouped[item.name].qty += 1;
    } else {
      grouped[item.name] = {
        price: item.price,
        qty: 1
      };
    }
  });

  for (let name in grouped) {
    let item = grouped[name];
    let itemTotal = item.price * item.qty;
    total += itemTotal;

    message += `• ${name} x${item.qty} = ₹${itemTotal}%0A`;
  }

  message += `%0A💰 *Total: ₹${total}*`;

  // 👉 OPEN WHATSAPP WITH MESSAGE
  let url = `https://wa.me/${number}?text=${message}`;

  window.open(url, "_blank");
}

function removeOne(name) {
  for (let i = 0; i < cart.length; i++) {
    if (cart[i].name === name) {
      cart.splice(i, 1); // remove 1 item
      break;
    }
  }

  openCart();      // refresh cart page
  updateCartUI();  // update bottom bar
}

function addOne(name) {
  let item = menu.find(i => i.name === name);
  cart.push(item);

  openCart();      // refresh cart page
  updateCartUI();  // update bottom bar
}

function sendWhatsApp() {

  let number = "9855891578";
